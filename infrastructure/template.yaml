AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RoomieOps - AI-powered Shared-Living Operations Copilot

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        DYNAMODB_TABLE: !Ref HouseholdStateTable
        S3_BUCKET: !Ref DocumentsBucket
        BEDROCK_MODEL_ID: anthropic.claude-sonnet-4-5-20250929-v1:0
        STATE_MACHINE_ARN: !Ref EventWorkflowStateMachine

Resources:
  # S3 Bucket for document storage (receipts, bills, invoices)
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'roomieops-documents-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            NoncurrentVersionExpirationInDays: 30
            Status: Enabled

  # DynamoDB Table for household state (primary data store)
  HouseholdStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: roomieops-household-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: householdId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: HouseholdIdCreatedAtIndex
          KeySchema:
            - AttributeName: householdId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: RoomieOps

  # IAM Role for Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt HouseholdStateTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub '${HouseholdStateTable.Arn}/index/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${DocumentsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
        - PolicyName: StepFunctionsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt ProcessingStateMachine.Arn
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:GetUser
                Resource: !GetAtt CognitoUserPool.Arn

  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: RoomieOps
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Mutable: true
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Priority: 1
            Name: verified_email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: RoomieOps
      GenerateSecret: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - phone
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # API Gateway
  RoomieOpsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # P0 Lambda Functions

  # Households Handler (CRUD for household/member operations)
  HouseholdsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: roomieops-households
      CodeUri: ../backend/lambdas/households/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CreateHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households
            Method: POST
        GetHousehold:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}
            Method: GET
        GetMembers:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/members
            Method: GET
        AddMember:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/members
            Method: POST
        GetExpenses:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/expenses
            Method: GET
        GetBalances:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/balances
            Method: GET
        GetChores:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/chores
            Method: GET

  # Expenses Handler (create, calculate split)
  ExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: roomieops-expenses
      CodeUri: ../backend/lambdas/expenses/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CreateExpense:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/expenses
            Method: POST
        CalculateSplit:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/expenses/calculate
            Method: POST

  # Chores Handler (create, list, rotation)
  ChoresFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: roomieops-chores
      CodeUri: ../backend/lambdas/chores/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CreateChore:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/chores
            Method: POST
        CompleteChore:
          Type: Api
          Properties:
            RestApiId: !Ref RoomieOpsApi
            Path: /households/{id}/chores/{choreId}/complete
            Method: POST

  # Step Functions State Machine for event-driven workflows
  ProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: RoomieOpsEventWorkflow
      Type: STANDARD
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionUri: ../backend/stepfunctions/definition.yaml

  # IAM Role for Step Functions
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt HouseholdStateTable.Arn
        - PolicyName: LambdaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt HouseholdsFunction.Arn
                  - !GetAtt ExpensesFunction.Arn
                  - !GetAtt ChoresFunction.Arn

  # EventBridge Rule for scheduled household operations (optional)
  # To be implemented for reminders, bill notifications, chore deadlines, etc.

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${RoomieOpsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  HouseholdStateTableName:
    Description: DynamoDB table for household state
    Value: !Ref HouseholdStateTable
  DocumentsBucketName:
    Description: S3 bucket for documents
    Value: !Ref DocumentsBucket
  ProcessingStateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref ProcessingStateMachine
  HouseholdsFunctionArn:
    Description: Households Lambda function ARN
    Value: !GetAtt HouseholdsFunction.Arn
  ExpensesFunctionArn:
    Description: Expenses Lambda function ARN
    Value: !GetAtt ExpensesFunction.Arn
  ChoresFunctionArn:
    Description: Chores Lambda function ARN
    Value: !GetAtt ChoresFunction.Arn
