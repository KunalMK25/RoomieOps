AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spashta - Source-grounded decision support for regulations

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment

Globals:
  Function:
    Timeout: 300
    MemorySize: 512
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        DYNAMODB_TABLE: !Ref DocumentsTable
        S3_BUCKET: !Ref DocumentsBucket
        BEDROCK_MODEL_ID: anthropic.claude-sonnet-4-5-20250929-v1:0
        STATE_MACHINE_ARN: !Ref ProcessingStateMachine

Resources:
  # S3 Bucket for document storage
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'spashta-documents-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            NoncurrentVersionExpirationInDays: 30
            Status: Enabled

  # DynamoDB Table for document metadata and processing results
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spashta-documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: OwnerIdCreatedAtIndex
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: Spashta

  # IAM Role for Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt DocumentsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub '${DocumentsTable.Arn}/index/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${DocumentsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
        - PolicyName: StepFunctionsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt ProcessingStateMachine.Arn

  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: Spashta
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Mutable: true
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Priority: 1
            Name: verified_email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: Spashta
      GenerateSecret: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - phone
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # API Gateway
  SpashtagestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # Placeholder Lambda functions (to be implemented)
  ExtractLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spashta-extract
      CodeUri: ../backend/lambdas/extract/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn

  MatchSituationLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spashta-match-situation
      CodeUri: ../backend/lambdas/match-situation/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn

  RiskClassifyLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spashta-risk-classify
      CodeUri: ../backend/lambdas/risk-classify/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn

  ExplanationLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spashta-explanation
      CodeUri: ../backend/lambdas/explanation/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn

  # API Lambda Functions for HTTP endpoints
  PresignedUrlLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spashta-api-presigned-url
      CodeUri: ../backend/lambdas/api-presigned-url/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CreatePresignedUrl:
          Type: Api
          Properties:
            RestApiId: !Ref SpashtagestApi
            Path: /documents
            Method: post
            Auth:
              DefaultAuthorizer: CognitoAuthorizer

  StartProcessingLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spashta-api-start-processing
      CodeUri: ../backend/lambdas/api-start-processing/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ProcessingStateMachine
      Events:
        StartProcessing:
          Type: Api
          Properties:
            RestApiId: !Ref SpashtagestApi
            Path: /documents/{id}/process
            Method: post
            Auth:
              DefaultAuthorizer: CognitoAuthorizer

  GetDocumentLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spashta-api-get-document
      CodeUri: ../backend/lambdas/api-get-document/
      Handler: app.lambda_handler
      Runtime: python3.11
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        GetDocument:
          Type: Api
          Properties:
            RestApiId: !Ref SpashtagestApi
            Path: /documents/{id}
            Method: get
            Auth:
              DefaultAuthorizer: CognitoAuthorizer

  # Step Functions State Machine
  ProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: SpashtagestProcessingPipeline
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractLambda
        - LambdaInvokePolicy:
            FunctionName: !Ref MatchSituationLambda
        - LambdaInvokePolicy:
            FunctionName: !Ref RiskClassifyLambda
        - LambdaInvokePolicy:
            FunctionName: !Ref ExplanationLambda
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
      DefinitionUri: ../backend/stepfunctions/definition.yaml

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${SpashtagestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  DocumentsTableName:
    Description: DynamoDB table for documents
    Value: !Ref DocumentsTable
  DocumentsBucketName:
    Description: S3 bucket for documents
    Value: !Ref DocumentsBucket
